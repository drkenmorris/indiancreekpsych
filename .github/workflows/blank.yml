name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/supabase-clean-replay.test.mjs
      - run: npm run test:intake
      - run: node --test tests/scheduling.test.mjs
      - run: npx vitest run tests/office-hours.test.ts tests/appointments-ui.test.tsx
      - run: npm run test:attestations
      - run: npm run build
      - run: npx vitest run tests/kiosk-intake.test.tsx
