          ]
          for name in local_baseline_only:
              path = prefix + name
              if path in represented_head or path not in main or path not in head or main[path] != head[path]:
                  sys.exit('Local baseline source missing, changed, or already represented: ' + path)
              baseline[name] = main[path]
              represented_head.add(path)
              print('LOCAL BASELINE ONLY (not a production ledger entry) ' + name)
          pathlib.Path('baseline-versions.txt').write_text(''.join(v + '\n' for v in sorted(n.split('_', 1)[0] for n in baseline)))
          pending = {}
          for path, data in sorted(head.items()):
              if path in represented_head:
                  continue
              name = pathlib.Path(path).name
              if not re.fullmatch(r'[0-9]{14}_.+\.sql', name):
                  sys.exit('Unexpected migration filename: ' + name)
              pending[name] = data
          versions = [n.split('_',1)[0] for n in [*baseline, *pending]]
          if len(set(versions)) != len(versions):
              sys.exit('Pending migration collides with an observed ledger version.')
          if not pending:
              sys.exit('No pending migrations found.')
          for name, data in baseline.items():
              pathlib.Path('supabase/migrations', name).write_bytes(data)
          pending_dir = pathlib.Path('pending-sql')
          pending_dir.mkdir()
          for name, data in pending.items():
              (pending_dir / name).write_bytes(data)
              print('PENDING ' + name)
          print(f'Pending SQL files: {len(pending)}')
          PY
          # No production data, project link, remote credentials, or seed.
          supabase db start
          export PGPASSWORD=postgres
          psql_local() { psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres "$@"; }
          psql_local -Atc "select current_setting('server_version_num')::int / 10000" | grep -qx 17
          psql_local -Atc 'select version from supabase_migrations.schema_migrations order by version' > actual-before.txt
          diff -u baseline-versions.txt actual-before.txt
          test "$(wc -l < baseline-versions.txt)" -eq 66
          test -z "$(comm -23 observed-versions.txt actual-before.txt)"
          echo "Verified all 62 observed ledger versions plus four explicitly local baseline reconstructions on disposable PostgreSQL 17"
          psql_local -At -F '|' -f "$GITHUB_WORKSPACE/scripts/emr-hosted-schema-preflight.sql"
          # Explicitly fictional historical data on the disposable local DB only.
          psql_local <<'SQL'
          BEGIN;
          DO $fixture$ BEGIN
            IF EXISTS (SELECT 1 FROM auth.users) OR EXISTS (SELECT 1 FROM public.appointments)
              OR EXISTS (SELECT 1 FROM public.patient_intakes) OR EXISTS (SELECT 1 FROM public.emr_bps_intake_reviews)
