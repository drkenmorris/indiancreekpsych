          LEDGER
          test "$(wc -l < observed-ledger.txt)" -eq 62
          cut -d' ' -f1 observed-ledger.txt > observed-versions.txt
          python3 - <<'PY'
          import hashlib, os, pathlib, re, subprocess, sys
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          base = os.environ['BASE_SHA']
          def git(*args):
              return subprocess.check_output(['git', '-C', str(workspace), *args])
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          main = {}
          for path in git('ls-tree', '-r', '--name-only', base, '--', 'supabase/migrations').decode().splitlines():
              if re.fullmatch(r'supabase/migrations/[0-9]{14}_.+\.sql', path):
                  main[path] = git('show', base + ':' + path)
          head = {str(p.relative_to(workspace)): p.read_bytes()
                  for p in (workspace / 'supabase/migrations').glob('*.sql')}
          ledger = [line.split() for line in pathlib.Path('observed-ledger.txt').read_text().splitlines()]
          def index(files):
              out = {}
              for path, data in files.items():
                  out.setdefault(digest(data), []).append(path)
              return out
          main_index, head_index = index(main), index(head)
          baseline, represented_head, errors, aliases = {}, set(), [], 0
          # Three reviewed historical exceptions: reconstruct the exact observed SQL,
          # never infer equivalence from filenames. Require immutable source bytes in both
          # trees and verify reconstructed live bytes against the observed SHA-256.
          prefix = 'supabase/migrations/'
          exceptions = {
              '20260926190223': ['20260926190144_grant_calendar_private_schema_usage.sql'],
              '20261111115727': ['20261110103000_emr_bps_intake_reviews.sql',
                                 '20261110121936_emr_workspace_conflict_http_status.sql',
                                 '20261111101500_emr_bps_review_account_provenance.sql'],
              '20261111134550': ['20261111133500_emr_patient_directory_recoverable_delete.sql'],
          }
          reconstructed = 0
          def reconstruct(version, files):
              if version == '20261111115727':
                  return b"set local lock_timeout='5s';\n" + b''.join(files)
              if version == '20260926190223':
                  expected = b'-- Public SECURITY INVOKER wrappers need schema access to call their explicitly\n-- granted implementations. This does not expose private through the Data API.\nGRANT USAGE ON SCHEMA private TO authenticated;\n'
                  if files[0] == expected:
                      return b'-- Invoker calendar wrappers require schema access; function grants and RLS still apply.\nGRANT USAGE ON SCHEMA private TO authenticated;'
              if version == '20261111134550':
                  expected = b'-- Directory deletion is reversible and preserves all patient-linked records.\nalter table public.clinical_patients\n add column directory_deleted_at timestamptz;\n'
                  if files[0] == expected:
                      return b"set local lock_timeout='5s'; alter table public.clinical_patients add column directory_deleted_at timestamptz;"
              return None
          for version, name, sha in ledger:
              if version in exceptions:
                  paths = [prefix + p for p in exceptions[version]]
                  if any(p not in main or p not in head or main[p] != head[p] or p in represented_head for p in paths):
                      errors.append(f'{version} {name}: reviewed exception source missing, changed or duplicated')
                      continue
                  data = reconstruct(version, [main[p] for p in paths])
                  if data is None or digest(data) != sha:
                      errors.append(f'{version} {name}: reviewed exception does not reconstruct observed SQL')
                      continue
                  represented_head.update(paths)
                  baseline[version + '_' + name + '.sql'] = data
                  reconstructed += 1
                  print(f'RECONSTRUCTED {version} {name} <- {paths}')
                  continue
              m, h = main_index.get(sha, []), head_index.get(sha, [])
              if len(m) != 1 or len(h) != 1:
                  candidates = [p for p in main if pathlib.Path(p).name.endswith('_' + name + '.sql')
                                or pathlib.Path(p).name.startswith(version + '_')]
                  errors.append(f'{version} {name}: exact main matches={len(m)}, head matches={len(h)}, name/version candidates={candidates}')
                  continue
              if h[0] in represented_head:
                  errors.append(f'{version} {name}: one repository migration maps to multiple live versions')
                  continue
              represented_head.add(h[0])
              if pathlib.Path(h[0]).name.split('_', 1)[0] != version:
                  aliases += 1
              baseline[version + '_' + name + '.sql'] = main[m[0]]
              print(f'EXACT {version} {name} <- {m[0]} -> {h[0]}')
          print(f'Exact SQL mappings: {len(baseline)-reconstructed}/{len(ledger)}; reconstructed: {reconstructed}; total verified: {len(baseline)}/{len(ledger)}; head version aliases: {aliases}')
          for error in errors:
              print('UNRESOLVED ' + error)
          if errors:
              sys.exit('Historical SQL not fully reconciled; no local replay attempted.')
          # Four main-branch migrations reconstruct objects already observed in production,
          # but have no historical ledger row. Include only in the disposable baseline;
          # never classify these as a live forward migration. This is not a full schema clone.
          local_baseline_only = [
              '20260925090000_account_newsletter_baseline.sql',
              '20260928200300_patient_booking_spacing_rule.sql',
