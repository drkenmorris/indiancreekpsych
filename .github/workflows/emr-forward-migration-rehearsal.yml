name: EMR forward migration rehearsal
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/emr-forward-migration-rehearsal.yml'
      - 'scripts/emr-hosted-schema-preflight.sql'
      - 'scripts/emr-forward-data-preflight.sql'
permissions:
  contents: read
jobs:
  forward-rehearsal:
    if: github.event.pull_request.number == 116 && github.head_ref == 'integration/emr-prototype-production-reconcile-20261109' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Rehearse forward-only upgrade from observed production migration ledger
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Schema-only approximation, not a production clone or live migration.
          # Snapshot from read-only ledger inspection on 2026-11-24 CST.
          # A changed main requires re-verification of the live ledger and baseline.
          test "$BASE_SHA" = f6efd40065c2d961629cf8ac36ef07a050af786d
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL
          sandbox="$(mktemp -d)"
          cd "$sandbox"
          supabase init
          mkdir -p supabase/migrations
          sed -i -E 's/^major_version = [0-9]+$/major_version = 17/' supabase/config.toml
          grep -qx 'major_version = 17' supabase/config.toml
          # Match the observed live SQL byte-for-byte, not just filename/version.
