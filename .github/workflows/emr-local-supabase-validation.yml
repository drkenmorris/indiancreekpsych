name: EMR isolated Supabase schema validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/emr-local-supabase-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-schema:
    # Run only for the clinic's own protected EMR integration branch.
    if: github.head_ref == 'integration/emr-prototype-production-reconcile-20261109' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 116 || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/integration/emr-prototype-production-reconcile-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Replay migrations on an isolated real Supabase Postgres stack
        shell: bash
        run: |
          set -euo pipefail
          # Copy only versioned migrations to a brand-new runner-local directory.
          # No hosted credentials, link, data dump, seed, or remote reset.
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD DATABASE_URL
          sandbox="$(mktemp -d)"
          cd "$sandbox"
          supabase init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          sed -i -E 's/^major_version = [0-9]+$/major_version = 17/' supabase/config.toml
          grep -qx 'major_version = 17' supabase/config.toml
          supabase db start
          export PGPASSWORD=postgres
          psql_local() { psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres "$@"; }
          # Compare every repository migration version to the actual database ledger.
          find supabase/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | cut -d_ -f1 | LC_ALL=C sort > expected-versions.txt
          psql_local -Atc 'select version from supabase_migrations.schema_migrations order by version' | LC_ALL=C sort > actual-versions.txt
          test -s expected-versions.txt
          diff -u expected-versions.txt actual-versions.txt
          psql_local -Atc "select current_setting('server_version_num')::int / 10000" | grep -qx 17
          # Confirm real Supabase auth schema and high-priority clinic relations are present.
          psql_local <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('auth.users') IS NULL
               OR to_regclass('auth.mfa_factors') IS NULL
               OR to_regclass('public.patient_intakes') IS NULL
               OR to_regclass('public.clinical_patients') IS NULL
               OR to_regclass('public.emr_bps_intake_reviews') IS NULL
               OR to_regclass('public.appointments') IS NULL THEN
              RAISE EXCEPTION 'Expected clinical or auth relation missing';
            END IF;
            IF EXISTS (
              SELECT 1 FROM pg_class
              WHERE oid IN ('public.patient_intakes'::regclass,
                            'public.clinical_patients'::regclass,
                            'public.emr_bps_intake_reviews'::regclass,
                            'public.appointments'::regclass)
                AND NOT relrowsecurity
            ) THEN
              RAISE EXCEPTION 'Expected clinical relation lacks RLS';
            END IF;
          END $$;
          SQL
          printf 'Verified real runner-local Postgres 17 migration versions: '
          wc -l < actual-versions.txt
          echo 'This is real local schema validation, not hosted preview or authenticated browser acceptance.'
      - name: Exercise actual migrated scheduler RLS on fictional local identities
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          # This stack lives only in this runner; never use a hosted URL or credential.
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres <<'SQL'
          BEGIN;
          -- Bootstrap only the fixture auth rows without signup side effects.
          -- Restore normal triggers before any clinical/scheduler operation.
          SET LOCAL session_replication_role = replica;
          INSERT INTO auth.users (id,email,email_confirmed_at,raw_app_meta_data,raw_user_meta_data)
          VALUES
            ('00000000-0000-4000-8000-000000000001','emr-admin@example.invalid',now(),'{}','{}'),
            ('00000000-0000-4000-8000-000000000002','emr-patient-a@example.invalid',now(),'{}','{}'),
            ('00000000-0000-4000-8000-000000000003','emr-patient-b@example.invalid',now(),'{}','{}');
          SET LOCAL session_replication_role = origin;
          INSERT INTO public.profiles(id,full_name,account_type) VALUES
            ('00000000-0000-4000-8000-000000000001','Fictional Administrator','admin'),
            ('00000000-0000-4000-8000-000000000002','Fictional Patient A','patient'),
            ('00000000-0000-4000-8000-000000000003','Fictional Patient B','patient');
          UPDATE public.appointment_settings SET scheduling_enabled=true,timezone='UTC' WHERE id;
          INSERT INTO public.appointment_availability_rules(weekday,start_time,end_time)
          VALUES (extract(dow from (current_date+2))::smallint,'08:00','18:00');
          -- Actual migrated policies and triggers, with simulated verified JWT claims.
          SET LOCAL ROLE authenticated;
          SELECT set_config('request.jwt.claims','{"sub":"00000000-0000-4000-8000-000000000001","role":"authenticated","aal":"aal2"}',true);
          INSERT INTO public.appointments(id,patient_id,starts_at,ends_at)
          VALUES
            ('00000000-0000-4000-8000-000000000101','00000000-0000-4000-8000-000000000002',(current_date+2+time '10:00') AT TIME ZONE 'UTC',(current_date+2+time '10:50') AT TIME ZONE 'UTC'),
            ('00000000-0000-4000-8000-000000000102','00000000-0000-4000-8000-000000000003',(current_date+2+time '12:00') AT TIME ZONE 'UTC',(current_date+2+time '12:50') AT TIME ZONE 'UTC');
          INSERT INTO public.appointments(id,patient_name,series_id,starts_at,ends_at)
          VALUES ('00000000-0000-4000-8000-000000000103','Fictional Unlinked Recurrence','00000000-0000-4000-8000-000000000201',(current_date+2+time '14:00') AT TIME ZONE 'UTC',(current_date+2+time '14:50') AT TIME ZONE 'UTC');
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.appointments) <> 3
               OR (SELECT count(*) FROM public.scheduling_patients()) <> 2
               OR NOT EXISTS(SELECT 1 FROM public.appointment_settings WHERE id)
            THEN RAISE EXCEPTION 'AAL2 administrator positive control failed'; END IF;
          END $$;
          SELECT set_config('request.jwt.claims','{"sub":"00000000-0000-4000-8000-000000000001","role":"authenticated","aal":"aal1"}',true);
          DO $$
          BEGIN
            IF EXISTS(SELECT 1 FROM public.appointments)
               OR EXISTS(SELECT 1 FROM public.appointment_settings)
               OR EXISTS(SELECT 1 FROM public.appointment_availability_rules)
            THEN RAISE EXCEPTION 'AAL1 administrator accessed protected scheduler rows'; END IF;
            BEGIN
              PERFORM * FROM public.scheduling_patients();
              RAISE EXCEPTION 'AAL1 administrator accessed protected patient list';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
          END $$;
          SELECT set_config('request.jwt.claims','{"sub":"00000000-0000-4000-8000-000000000002","role":"authenticated","aal":"aal1"}',true);
          DO $$
          DECLARE changed integer;
          BEGIN
            IF (SELECT count(*) FROM public.appointments) <> 1
               OR NOT EXISTS(SELECT 1 FROM public.appointments WHERE id='00000000-0000-4000-8000-000000000101')
            THEN RAISE EXCEPTION 'Patient A own-row or isolation control failed'; END IF;
            UPDATE public.appointments SET status='cancelled' WHERE id IN ('00000000-0000-4000-8000-000000000102','00000000-0000-4000-8000-000000000103');
            GET DIAGNOSTICS changed = ROW_COUNT;
            IF changed <> 0 THEN RAISE EXCEPTION 'Patient A changed another or unlinked booking'; END IF;
            UPDATE public.appointments SET status='cancelled' WHERE id='00000000-0000-4000-8000-000000000101';
            GET DIAGNOSTICS changed = ROW_COUNT;
            IF changed <> 1 THEN RAISE EXCEPTION 'Patient A own cancellation control failed'; END IF;
          END $$;
          SELECT set_config('request.jwt.claims','{"sub":"00000000-0000-4000-8000-000000000003","role":"authenticated","aal":"aal1"}',true);
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.appointments) <> 1
               OR NOT EXISTS(SELECT 1 FROM public.appointments WHERE id='00000000-0000-4000-8000-000000000102' AND status='booked')
            THEN RAISE EXCEPTION 'Patient B own-row or isolation control failed'; END IF;
          END $$;
          ROLLBACK;
          SQL
          echo 'Actual migrated scheduler RLS and booking/cancellation checks passed on local PostgreSQL; JWT claims simulated, not browser MFA.'
